<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Крупнейшие месторождения России</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f0f4fc;
            padding: 20px;
        }
        
        .header {
            background: #0a0e1a;
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            margin-bottom: 30px;
            border-bottom: 4px solid #ffaa00;
        }
        
        .header h1 {
            font-size: 2rem;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin: 30px 0 20px;
            border-left: 5px solid #ffaa00;
            padding-left: 15px;
        }
        
        /* КАРТОЧКИ */
        .field-item {
            background: white;
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .field-header {
            background: #f8fafc;
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 2px solid #ffaa00;
            display: flex;
            justify-content: space-between;
        }
        
        .field-header h3 {
            color: #ff6600;
        }
        
        .field-detail {
            display: none;
            padding: 20px;
            background: white;
            line-height: 1.6;
        }
        
        .field-detail.show {
            display: block;
        }
        
        .info-item {
            margin: 8px 0;
        }
        
        .bot-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ffaa00;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
        }
        
        .bot-window {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 300px;
            background: white;
            border: 2px solid #ffaa00;
            border-radius: 16px;
            display: none;
            flex-direction: column;
        }
        
        .bot-window.open {
            display: flex;
        }
        
        .bot-header {
            background: #ffaa00;
            padding: 12px;
            font-weight: bold;
        }
        
        .bot-msgs {
            height: 250px;
            overflow-y: auto;
            padding: 12px;
            background: #f8fafc;
        }
        
        .bot-msg {
            background: #e2e8f0;
            padding: 8px;
            border-radius: 12px;
            margin: 8px 0;
        }
        
        .user-msg {
            background: #ffaa00;
            padding: 8px;
            border-radius: 12px;
            margin: 8px 0;
            text-align: right;
        }
        
        .bot-input {
            display: flex;
            padding: 10px;
            gap: 8px;
            border-top: 1px solid #ddd;
        }
        
        .bot-input input {
            flex: 1;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid #ffaa00;
        }
        
        .bot-input button {
            background: #ffaa00;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            margin-top: 40px;
            background: #e8edf5;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🏭 Крупнейшие месторождения России</h1>
    <p>ТОП-10 | Интерактивные карточки | Помощник</p>
</div>

<div style="max-width: 1000px; margin: 0 auto;">
    <div class="section-title">📋 Месторождения — нажми для подробностей</div>
    <div id="fieldsList"></div>
</div>

<div class="footer">
    © 2026 Крупнейшие месторождения России
</div>

<div class="bot-btn" id="botBtn">🤖</div>
<div class="bot-window" id="botWindow">
    <div class="bot-header">Помощник</div>
    <div class="bot-msgs" id="botMsgs">
        <div class="bot-msg">Привет! Спрашивай про месторождения.</div>
    </div>
    <div class="bot-input">
        <input id="botInput" placeholder="Например: Самотлорское">
        <button id="botSend">➤</button>
    </div>
</div>

<script>
    // ===== МЕСТОРОЖДЕНИЯ =====
    const fields = [
        { name: "Самотлорское", region: "ХМАО", reserves: "7 млрд тонн", year: "1965", operator: "Роснефть", production: "35 млн т/год", oilType: "Легкая", depth: "1650-2450 м", drilling: "Роторное бурение, горизонтальные скважины", workers: "~5000 чел", relief: "Болотистая равнина", features: "Крупнейшее месторождение РФ" },
        { name: "Приобское", region: "ХМАО", reserves: "5 млрд тонн", year: "1982", operator: "Газпром нефть", production: "40 млн т/год", oilType: "Средняя", depth: "2100-2600 м", drilling: "Горизонтальное бурение, ГРП", workers: "~4000 чел", relief: "Пойма реки Обь", features: "Разделено на лево- и правобережную части" },
        { name: "Ромашкинское", region: "Татарстан", reserves: "5 млрд тонн", year: "1948", operator: "Татнефть", production: "15 млн т/год", oilType: "Высокосернистая", depth: "1200-1800 м", drilling: "Термошахтный метод", workers: "~3500 чел", relief: "Холмистая равнина", features: "Старейшее крупное месторождение, более 75 лет" },
        { name: "Ванкорское", region: "Красноярский край", reserves: "500 млн тонн", year: "1988", operator: "Роснефть", production: "22 млн т/год", oilType: "Легкая (ESPO)", depth: "1800-2300 м", drilling: "ГРП", workers: "~2500 чел", relief: "Тайга, вечная мерзлота", features: "Флагман Восточной Сибири" },
        { name: "Приразломное", region: "Печорское море", reserves: "70 млн тонн", year: "1989", operator: "Газпром нефть", production: "1.2 млн т/год", oilType: "Арктическая", depth: "Шельф 20 м", drilling: "Морское бурение", workers: "~800 чел", relief: "Арктический шельф", features: "Первое арктическое шельфовое" },
        { name: "Новопортовское", region: "Ямал", reserves: "250 млн тонн", year: "1964", operator: "Газпром нефть", production: "8 млн т/год", oilType: "Легкая", depth: "900-1500 м", drilling: "Горизонтальное", workers: "~1500 чел", relief: "Тундра", features: "Терминал Ворота Арктики" },
        { name: "Фёдоровское", region: "ХМАО", reserves: "1.5 млрд тонн", year: "1971", operator: "Сургутнефтегаз", production: "12 млн т/год", oilType: "Смешанная", depth: "2000-2400 м", drilling: "ЭЦН, ППД", workers: "~2000 чел", relief: "Болота", features: "Ключевой актив Сургутнефтегаза" },
        { name: "Лянторское", region: "ХМАО", reserves: "2 млрд тонн", year: "1965", operator: "Сургутнефтегаз", production: "10 млн т/год", oilType: "Средняя", depth: "1900-2300 м", drilling: "Роторное", workers: "~1800 чел", relief: "Заболоченная равнина", features: "Многопластовое месторождение" },
        { name: "Русское", region: "ЯНАО", reserves: "1.5 млрд тонн", year: "1968", operator: "Роснефть", production: "4 млн т/год", oilType: "Высоковязкая", depth: "800-1500 м", drilling: "Термические методы", workers: "~1200 чел", relief: "Тундра", features: "Сверхвязкая нефть" },
        { name: "Талаканское", region: "Якутия", reserves: "124 млн тонн", year: "1987", operator: "Сургутнефтегаз", production: "4.5 млн т/год", oilType: "Легкая", depth: "1600-1850 м", drilling: "Горизонтальное", workers: "~1000 чел", relief: "Тайга, мерзлота", features: "Нефть марки ESPO" }
    ];
    
    // ===== КАРТОЧКИ =====
    const container = document.getElementById('fieldsList');
    
    fields.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'field-item';
        div.innerHTML = `
            <div class="field-header" onclick="toggleDetail(${i})">
                <h3>${f.name}</h3>
                <span>▼</span>
            </div>
            <div class="field-detail" id="detail-${i}">
                <div class="info-item"><strong>📍 Регион:</strong> ${f.region}</div>
                <div class="info-item"><strong>📦 Запасы:</strong> ${f.reserves}</div>
                <div class="info-item"><strong>📅 Год открытия:</strong> ${f.year}</div>
                <div class="info-item"><strong>🏢 Оператор:</strong> ${f.operator}</div>
                <div class="info-item"><strong>⛽ Добыча:</strong> ${f.production}</div>
                <div class="info-item"><strong>🛢️ Тип нефти:</strong> ${f.oilType}</div>
                <div class="info-item"><strong>⛏️ Глубина:</strong> ${f.depth}</div>
                <div class="info-item"><strong>⛏️ Чем бурят:</strong> ${f.drilling}</div>
                <div class="info-item"><strong>👷 Работников:</strong> ${f.workers}</div>
                <div class="info-item"><strong>🗺️ Рельеф:</strong> ${f.relief}</div>
                <div class="info-item"><strong>⚡ Особенности:</strong> ${f.features}</div>
            </div>
        `;
        container.appendChild(div);
    });
    
    window.toggleDetail = function(id) {
        const el = document.getElementById(`detail-${id}`);
        el.classList.toggle('show');
    };
    
    // ===== БОТ =====
    const botMsgs = document.getElementById('botMsgs');
    const botInput = document.getElementById('botInput');
    
    function botAnswer(q) {
        const query = q.toLowerCase();
        const field = fields.find(f => query.includes(f.name.toLowerCase()));
        if (field) {
            return `${field.name}: ${field.region}, запасы ${field.reserves}, добыча ${field.production}. 👷 ${field.workers}. 🗺️ ${field.relief}`;
        }
        if (query.includes('технологи')) {
            return "Технологии: горизонтальное бурение, ГРП, термические методы, ППД.";
        }
        if (query.includes('крупнейш')) {
            return "ТОП-3: Самотлорское (7 млрд т), Приобское (5 млрд т), Ромашкинское (5 млрд т)";
        }
        return "Напиши название месторождения: Самотлорское, Приобское, Ромашкинское, Ванкорское, Приразломное, Новопортовское, Фёдоровское, Лянторское, Русское, Талаканское";
    }
    
    function addMsg(text, isUser) {
        const div = document.createElement('div');
        div.className = isUser ? 'user-msg' : 'bot-msg';
        div.innerHTML = isUser ? text : `🤖 ${text}`;
        botMsgs.appendChild(div);
        botMsgs.scrollTop = botMsgs.scrollHeight;
    }
    
    document.getElementById('botSend').onclick = () => {
        const txt = botInput.value.trim();
        if (!txt) return;
        addMsg(txt, true);
        setTimeout(() => addMsg(botAnswer(txt), false), 100);
        botInput.value = '';
    };
    
    botInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('botSend').click();
    });
    
    document.getElementById('botBtn').onclick = () => {
        document.getElementById('botWindow').classList.toggle('open');
    };
</script>
</body>
</html>
